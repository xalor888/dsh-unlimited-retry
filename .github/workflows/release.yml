name: Release

# Publishing is a deliberate act: a tag is the only trigger, and the tag must
# agree with package.json. Nothing here publishes from a branch.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and verify only; do not publish'
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No registry-url: it writes an `_authToken=` line that would be empty
          # here, and trusted publishing must authenticate through OIDC alone.
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Use a modern npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Refuse a tag that disagrees with package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # A published version cannot be unpublished, so catch the mismatch here
          # rather than after the registry has accepted a wrong number.
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build the tarball
        id: pack
        # `npm pack --silent` prints only the filename; see ci.yml for why the
        # --json output is no longer parsed with `node -e`.
        run: |
          FILENAME="$(npm pack --silent)"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "packed $FILENAME"

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        # No NODE_AUTH_TOKEN here on purpose. A trusted publisher authenticates this
        # job through GitHub's OIDC token, which is why `id-token: write` is above;
        # supplying a static token as well would defeat the point and expire.
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set; trusted publishing must run without it."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          # A version cannot be republished, and a re-run after a later step failed
          # must not die here. Checking first makes the job converge instead of
          # forcing a manual publish that then blocks the remaining steps.
          if npm view "dsh-unlimited-retry@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$VERSION is already on the registry; skipping the publish step."
            exit 0
          fi
          npm publish --provenance --access public

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.pack.outputs.filename }}"

      - name: Install the published version from the registry
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        run: |
          # Proves the registry copy — not just the local tarball — is complete.
          # The registry answers for a new version before every CDN edge does, so
          # `npm view` succeeding is not enough: the install itself must resolve.
          # Poll the exact thing the next step needs, generously — a publish is
          # never rolled back because a verification step ran out of patience.
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if npm view "dsh-unlimited-retry@$VERSION" version >/dev/null 2>&1 \
              && npm pack "dsh-unlimited-retry@$VERSION" --dry-run >/dev/null 2>&1; then
              echo "registry serves $VERSION (attempt $attempt)"
              break
            fi
            echo "waiting for the registry to serve $VERSION (attempt $attempt/30)"
            sleep 20
          done
          mkdir -p /tmp/registry-check && cd /tmp/registry-check
          npm init -y >/dev/null
          npm install "dsh-unlimited-retry@$VERSION" --no-audit --no-fund
          node --input-type=module -e "
          const plugin = await import('dsh-unlimited-retry');
          if (plugin.name !== 'unlimited-retry' || typeof plugin.apply !== 'function') {
            throw new Error('the published package does not mount');
          }
          console.log('published package mounts');
          "
