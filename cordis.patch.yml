# dsh-unlimited-retry bundle patch.
#
# One Loader row. The `config` block below is the profile-independent default:
# an override anywhere above this layer replaces the WHOLE `config`, so any
# layer that overrides this row must restate every field it wants to keep.
#
# Defaults are deliberate:
#   autoRetry: true          — the plugin's entire reason to exist
#   retryCodes: the five the Harness itself retries (EMPTY_RESPONSE, RATE_LIMIT,
#               SERVER, TIMEOUT, TRANSPORT). Anything else is the upstream
#               layer's judgement that re-sending will not help: a code nobody
#               classified is how 2.x retried the same dead request forever.
#   retryAllCodes: false     — set true to retry everything except exclusions
#   maxAttempts: null        — no per-step attempt limit
#   maxRetriesPerTurn: 40    — hard stop, so a fault that survives every step
#                              cannot keep a turn alive indefinitely
#   maxDelayMs: 60000        — ceiling for any single wait
#
# If you want a wider or narrower policy, change retryCodes (or retryAllCodes),
# and use excludeCodes for codes that must stay terminal either way.

- insert:
    - id: unlimited-retry
      name: dsh-unlimited-retry
      config:
        autoRetry: true
        maxAttempts: null
        initialDelayMs: 1000
        maxDelayMs: 60000
        jitterRatio: 0.2
        retryWithoutProviderPolicy: true
        retryCodes:
          - EMPTY_RESPONSE
          - RATE_LIMIT
          - SERVER
          - TIMEOUT
          - TRANSPORT
        retryAllCodes: false
        maxRetriesPerTurn: 40
        excludeCodes: []
        recordSessionEvents: true
        log: true
        # Opt-in mount probe: set to an absolute path to write one JSON line on
        # activation. Left null because it is a diagnostic, not a feature.
        markerFile: null
